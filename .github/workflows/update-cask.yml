name: Update cask

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update the cask from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-cask
      - name: Commit and push
        run: |
          if git diff --quiet -- Casks/mytoken.rb; then
            echo "Cask is already current."
            exit 0
          fi
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/mytoken.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/mytoken.rb
          git commit -m "mytoken: update to ${version}"
          git push
