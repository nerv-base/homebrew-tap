name: Update kiseki formula

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific Kiseki v2 release tag (optional, defaults to latest v2.*)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Formula/kiseki.rb from latest v2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            ./scripts/update-kiseki "${{ inputs.tag }}"
          else
            ./scripts/update-kiseki
          fi
      - name: Commit and push
        run: |
          if git diff --quiet -- Formula/kiseki.rb && [ -z "$(git ls-files --others --exclude-standard Formula/kiseki.rb)" ]; then
            echo "Formula/kiseki.rb is already current."
            exit 0
          fi
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/kiseki.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kiseki.rb
          git commit -m "kiseki: update to ${version}"
          git push
